<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector OMR - Protótipo</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #fafafa; }
        #video-container { position: relative; display: inline-block; width: 100%; max-width: 500px; }
        video { width: 100%; border-radius: 8px; transform: scaleX(1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        button { margin-top: 15px; padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Protótipo OMR: Captura e Alinhamento</h2>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>

    <br>
    <button id="btn-capturar">Processar Frame</button>

    <script src="app.js"></script>
</body>
</html>
