<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor OMR - Protótipo Piloto</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        .btn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin: 10px 0;
            width: 100%;
            max-width: 300px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        #video-container {
            position: relative;
            display: none; /* Oculto até a câmera ser ativada */
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #log {
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Scanner de Gabarito (OMR)</h2>
        <p style="font-size: 14px; color: #666;">Alinhe o gabarito dentro da área demarcada na tela.</p>
        
        <button id="btn-iniciar" class="btn">Ativar Câmera</button>
        
        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
        </div>

        <br>
        <button id="btn-capturar" class="btn" style="display: none; background-color: #28a745;">Processar Prova</button>
        
        <div id="log"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
